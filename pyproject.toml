[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdview"
version = "0.1.0"
description = "Terminal markdown browser with a directory tree and kitty-protocol images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mdview = "mdview.app:main"

[tool.setuptools]
packages = ["mdview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
